name: Build Nord CE5 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Debug APK (SDK 35 / OnePlus Nord CE5)
        run: gradle assembleDebug --no-daemon

      - name: Rename APK Artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk shadowing-nord-ce5-v1.0.0.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: shadowing-nord-ce5-apk
          path: shadowing-nord-ce5-v1.0.0.apk
          retention-days: 30
